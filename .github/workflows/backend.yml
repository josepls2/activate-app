name: Backend

on:
  push:
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package.json
      - run: npm install --prefix functions --ignore-scripts
      - run: npm test
      - run: npm run lint
