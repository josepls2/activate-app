# Prueba las reglas de Firestore con el emulador y, si pasan, las publica junto
# con los índices. Sustituye a «firebase deploy» en tu ordenador.
# Requiere el secreto FIREBASE_SERVICE_ACCOUNT (ver web/README.md).
name: Reglas de Firestore

on:
  push:
    branches: [main, master]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "web/tests/**"
      - ".github/workflows/firebase-rules.yml"
  pull_request:
    paths:
      - "firestore.rules"
      - "web/tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Tests de reglas (emulador)
        run: >
          npx --yes firebase-tools@15 emulators:exec
          --only firestore --project demo-activate
          "npm --prefix web run test:rules"

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Credenciales
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
      - name: Publicar reglas e índices
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: >
          npx --yes firebase-tools@15 deploy
          --only firestore:rules,firestore:indexes
          --project activayte-34e0b --non-interactive
      - name: Borrar credenciales
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
